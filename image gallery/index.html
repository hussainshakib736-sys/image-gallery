<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      padding: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
    }

    .lightbox:target {
      display: flex;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <h1>My Image Gallery</h1>
  <div class="gallery">
    <a href="#img1"><img src="https://picsum.photos/id/1015/400/300" alt="Gallery Image 1"></a>
    <a href="#img2"><img src="https://picsum.photos/id/1016/400/300" alt="Gallery Image 2"></a>
    <a href="#img3"><img src="https://picsum.photos/id/1018/400/300" alt="Gallery Image 3"></a>
    <a href="#img4"><img src="https://picsum.photos/id/1020/400/300" alt="Gallery Image 4"></a>
  </div>

  <!-- Lightbox Images -->
  <div id="img1" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="https://picsum.photos/id/1015/800/600" alt="Large Image 1">
  </div>
  <div id="img2" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="https://picsum.photos/id/1016/800/600" alt="Large Image 2">
  </div>
  <div id="img3" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="https://picsum.photos/id/1018/800/600" alt="Large Image 3">
  </div>
  <div id="img4" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="https://picsum.photos/id/1020/800/600" alt="Large Image 4">
  </div>
</body>

</html>
